name: Release Boundary

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: release-boundary-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-boundary:
    name: Release Boundary
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Set up Bun
        uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: State release boundary
        run: |
          echo "No npm publish, Docker push, or release creation is authorized."
          echo "This workflow is a public boundary check for Metaforge/OpenClaude."
          echo "Use product-quality evidence before any future release pipeline is added."

      - name: Verify boundary text
        run: |
          grep -q "No npm publish, Docker push, or release creation is authorized" .github/workflows/release.yml
