name: Release Boundary

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: release-boundary-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  release-boundary:
    name: Release Boundary
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: State release boundary
        run: |
          echo "No npm publish, Docker push, or release creation is authorized."
          echo "This workflow is a public boundary check for Metaforge/OpenClaude."
          echo "Use product-quality evidence before any future release pipeline is added."

      - name: Verify boundary text
        run: |
          grep -q "No npm publish, Docker push, or release creation is authorized" .github/workflows/release.yml
